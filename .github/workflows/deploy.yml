name: FreshBox SpA — Deploy EP1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  REGISTRY: 722802907878.dkr.ecr.us-east-1.amazonaws.com

jobs:

  ecr-repos:
    name: Crear repositorios ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: Terraform Init
        working-directory: terraform
        run: terraform init
      - name: Crear solo repos ECR
        working-directory: terraform
        run: terraform apply -target=aws_ecr_repository.repos -auto-approve

  build-push:
    name: Build & Push imagenes a ECR
    runs-on: ubuntu-latest
    needs: ecr-repos
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login a Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build y Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./microservicioFrontend
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/freshbox-frontend:latest
      - name: Build y Push get-products
        uses: docker/build-push-action@v5
        with:
          context: ./microserviciosBackend/get-products
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/freshbox-get-products:latest
      - name: Build y Push create-product
        uses: docker/build-push-action@v5
        with:
          context: ./microserviciosBackend/create-product
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/freshbox-create-product:latest
      - name: Build y Push update-product
        uses: docker/build-push-action@v5
        with:
          context: ./microserviciosBackend/update-product
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/freshbox-update-product:latest
      - name: Build y Push delete-product
        uses: docker/build-push-action@v5
        with:
          context: ./microserviciosBackend/delete-product
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/freshbox-delete-product:latest

  deploy:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: Terraform Init
        working-directory: terraform
        run: terraform init
      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve
      - name: Mostrar ALB DNS
        working-directory: terraform
        run: terraform output alb_dns_name
