name: Deploy FreshBox to AWS EKS

on:
  push:
    branches:
      - ep2
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: freshbox-cluster
  K8S_DIR: k8s

jobs:
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Actualizar Kubeconfig para EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Aplicar manifiestos de Kubernetes
        run: |
          kubectl apply -f ${{ env.K8S_DIR }}/namespace.yaml
          kubectl apply -f ${{ env.K8S_DIR }}/secret.yaml
          kubectl apply -f ${{ env.K8S_DIR }}/configmap.yaml
          kubectl apply -f ${{ env.K8S_DIR }}/

      - name: Verificar Estado de los Deployments
        run: |
          kubectl rollout status deployment/get-products -n freshbox --timeout=120s
          kubectl rollout status deployment/create-product -n freshbox --timeout=120s
          kubectl rollout status deployment/update-product -n freshbox --timeout=120s
          kubectl rollout status deployment/delete-product -n freshbox --timeout=120s
          kubectl rollout status deployment/frontend -n freshbox --timeout=120s

      - name: Estado final de recursos
        run: |
          kubectl get pods,svc,ingress -n freshbox
